[package]
name = "awa-sqlx-0-9-app"
version = "0.0.0"
edition = "2021"
publish = false
description = "An application on sqlx 0.9 that runs awa 0.6, which is built on sqlx 0.8"

# Built on its own, not as part of the awa workspace.
[workspace]

[dependencies]
awa = { path = "../../awa", features = ["sqlx09"] }
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
# The application's own sqlx. With no lockfile, CI builds against the newest
# sqlx 0.9 release from 0.9.1 on.
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
# The sqlx awa 0.6 is built on, under another name, for awa's pool.
sqlx08 = { package = "sqlx", version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1", features = ["full"] }
