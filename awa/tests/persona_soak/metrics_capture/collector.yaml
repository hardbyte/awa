receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1024
exporters:
  file/raw:
    path: /data/metrics.jsonl
    append: true
    format: json
    flush_interval: 1s
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
    resource_to_telemetry_conversion:
      enabled: true
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file/raw, prometheus]
  telemetry:
    logs:
      level: info
