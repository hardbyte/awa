apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Fixed UID so the datasource is stable across restarts; the dashboards
    # pick it through their `datasource` variable.
    uid: prometheus_default
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
