name: Commit metadata

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  commit-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts/tests -p test_check_commit_metadata.py -v
      - name: Check commit messages and the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The base branch's checker runs, so a PR cannot relax the rules that judge it.
        run: |
          checker="$RUNNER_TEMP/check-commit-metadata.py"
          git show "$BASE_SHA:scripts/check-commit-metadata.py" > "$checker" 2>/dev/null \
            || cp scripts/check-commit-metadata.py "$checker"
          python3 "$checker" "$BASE_SHA" "$HEAD_SHA"
