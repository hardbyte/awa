name: Docs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs.yml
      - awa/examples/quickstart.rs
      - awa-python/examples/quickstart.py
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - scripts/check-docs.sh
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
    paths:
      - .github/workflows/docs.yml
      - awa/examples/quickstart.rs
      - awa-python/examples/quickstart.py
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - scripts/check-docs.sh
  workflow_dispatch:

concurrency:
  group: awa-docs-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Build docs and check canonical examples
        run: scripts/check-docs.sh

      - name: Prepare Pages artifact
        run: touch site/.nojekyll

      - uses: actions/upload-artifact@v7
        with:
          name: awa-docs-${{ github.run_id }}
          path: site
          include-hidden-files: true
          if-no-files-found: error

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: awa-docs-${{ github.run_id }}
          path: site

      - name: Publish pull request preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  remove-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Remove pull request preview
        uses: rossjrw/pr-preview-action@v1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: awa-docs-${{ github.run_id }}
          path: site

      - name: Publish production site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview
          force: false
