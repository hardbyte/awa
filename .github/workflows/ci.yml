name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test

# PRs default to a low-minute gate so AWA does not monopolize shared Actions
# capacity across repositories. Add the `full-ci` label, dispatch CI manually,
# or merge to main/a release branch to run the expensive DB/Python/E2E/smoke matrix.

jobs:
  # The release workflow requires a successful branch-push CI run on the exact
  # tagged SHA. Keep the storage models here so that gate covers the executable
  # tests and their formal concurrency model together.
  tla-storage:
    name: TLA+ storage model checking
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Docker version
        run: docker --version
      - name: Run TLC model suite
        run: ./correctness/run-tlc-suite.sh

  # ─── Rust ───────────────────────────────────────────────
  rust-lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check CI test-shard membership
        run: ./scripts/ci-test-shard.sh check

  rust-build:
    name: Rust build
    needs: [rust-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: cargo build
        run: cargo build --workspace

  rust-test:
    name: Rust tests (pg${{ matrix.postgres }}, ${{ matrix.shard }})
    needs: [rust-build]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    # The migration replay suite is partitioned per-test across four shards
    # with cargo-nextest, the other slow awa binaries form `heavy`, every
    # other awa test binary (including new test files, automatically) lands
    # in `rest`, and the remaining workspace crates plus doctests run as
    # `workspace`. Shard membership lives in scripts/ci-test-shard.sh; the
    # lint job runs its `check` mode so renames can't silently drop coverage.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Postgres majors we support. The schema, its partitioning, and the
        # planner behaviour the claim path depends on are all version-
        # sensitive, so the whole sharded suite runs on each major rather
        # than a smoke subset.
        postgres: ["17", "18"]
        shard:
          - migrations-1
          - migrations-2
          - migrations-3
          - migrations-4
          - heavy
          - rest
          - workspace
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awa_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Run test shard
        run: ./scripts/ci-test-shard.sh "${{ matrix.shard }}"
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test

  # ─── Released → candidate → released patch upgrade rehearsal ──
  patch-upgrade-rehearsal:
    name: Patch upgrade rehearsal (${{ matrix.released }}, pg${{ matrix.postgres }})
    needs: [rust-build]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
        released: ["0.6.9", "0.6.15"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: astral-sh/setup-uv@v5
      - name: Install released ${{ matrix.released }} artifacts
        run: |
          uv venv --quiet --clear .released
          uv pip install --quiet --python .released "awa-pg==${{ matrix.released }}" "awa-cli==${{ matrix.released }}"
          .released/bin/awa --version
      - name: Build candidate CLI
        run: cargo build -p awa-cli
      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Rehearse upgrade, mixed fleet, rollback and privilege tightening
        run: |
          set -o pipefail
          cargo test -p awa --test patch_upgrade_rehearsal_test -- --ignored --nocapture 2>&1 \
            | tee rehearsal-output.log
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          AWA_RELEASED_VERSION: ${{ matrix.released }}
          AWA_RELEASED_CLI: .released/bin/awa
          AWA_RELEASED_PYTHON: .released/bin/python
          AWA_CANDIDATE_CLI: target/debug/awa
          AWA_REHEARSAL_ARTIFACT_DIR: ${{ github.workspace }}/rehearsal-artifacts
      - name: Collect Postgres logs
        if: failure()
        run: docker logs "${{ job.services.postgres.id }}" > postgres.log 2>&1 || true
      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-upgrade-rehearsal-${{ matrix.released }}-pg${{ matrix.postgres }}-${{ github.sha }}
          path: |
            rehearsal-artifacts/
            rehearsal-output.log
            postgres.log
          retention-days: 90
          if-no-files-found: warn

  # ─── Integration suite under the queue-storage engine ──
  # awa's caller-facing contract is engine-invariant; the default suite runs
  # canonical, so this leg re-runs it with the queue-storage engine active on a
  # fresh database (a separate DB avoids cross-engine job_unique_claims carryover).
  rust-test-queue-storage:
    name: Rust tests (queue_storage, pg${{ matrix.postgres }})
    needs: [rust-build]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awa_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Run integration suite under queue storage
        run: cargo test -p awa --test integration_test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test
          AWA_TEST_ENGINE: queue_storage

  # Runs the queue-storage prune suite against AlloyDB Omni (PG 18) to guard
  # the idle-prune churn regression on a disaggregated-storage engine: awa
  # re-TRUNCATE-ing empty ring slots every maintenance tick saturates AlloyDB's
  # regional-storage IO. Omni runs as a plain Postgres service here; the
  # columnar-engine preload is unnecessary because the tests assert logical
  # prune behaviour (Noop + no relfilenode churn on empty slots), not columnar
  # performance.
  rust-test-alloydb-omni:
    name: Rust prune tests (AlloyDB Omni)
    needs: [rust-build]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      alloydb:
        image: gcr.io/alloydb-omni/alloydbomni:18.3
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awa_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Wait for AlloyDB Omni
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Run prune suite on AlloyDB Omni
        run: cargo test -p awa --test queue_storage_runtime_test prune
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test
          AWA_TEST_ENGINE: queue_storage

  # ─── Rust bridge (tokio-postgres) ──────────────────────
  rust-bridge-tokio-pg:
    name: Rust bridge (tokio-postgres)
    needs: [rust-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awa_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Run bridge tests (awa-model)
        run: cargo test --package awa-model --features tokio-postgres --test bridge_tokio_pg_test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test
      - name: Verify facade re-export compiles
        run: cargo check --package awa --features tokio-postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test

  # ─── Python (awa-python) ────────────────────────────────
  python-build-test:
    name: Python build + test (${{ matrix.python }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awa_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: awa-python
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "awa-python -> awa-python/target"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Create venv and install deps
        run: |
          uv venv .venv
          uv pip install maturin pytest pytest-asyncio asyncpg django greenlet psycopg psycopg-binary sqlalchemy
      - name: Build extension (maturin develop)
        run: .venv/bin/maturin develop
      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Run Python tests
        run: .venv/bin/pytest tests/ -v -m "not chaos" --durations=25
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test
      - name: Run Python chaos recovery test
        run: .venv/bin/pytest tests/test_chaos_recovery.py -v -m chaos
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test
      - name: Run Python examples (README drift detection)
        run: |
          .venv/bin/python examples/quickstart.py
          .venv/bin/python examples/sync_api.py
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test
  # ─── Frontend ──────────────────────────────────────────
  frontend-lint:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: awa-ui/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend E2E tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    # Playwright's Chromium build doesn't support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    # 20m has been hitting the wall on slow GH-hosted runners — the
    # full Playwright suite (8 specs) plus per-test PG seeding is on
    # the edge at 17–19m. Give it real headroom.
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awa_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: awa-ui/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build CLI (with embedded frontend)
        run: cargo build -p awa-cli
        working-directory: .
      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
        working-directory: .
      - name: Run migrations
        run: ../../target/debug/awa --database-url "$DATABASE_URL" migrate
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Run E2E tests
        run: npx playwright test

  # ─── CLI wheel build test ───────────────────────────────
  cli-wheel-build:
    name: CLI wheel build
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build CLI wheel (maturin)
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --manifest-path awa-cli/Cargo.toml
          before-script-linux: |
            apt-get update && apt-get install -y libpq-dev || true
      - name: Verify wheel contents
        run: |
          pip install dist/*.whl
          awa --help

  # ─── CLI smoke test ─────────────────────────────────────
  cli-smoke:
    name: CLI smoke test
    needs: [rust-build]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awa_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Build CLI
        run: cargo build -p awa-cli
      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Run migrations via CLI
        run: ./target/debug/awa --database-url postgres://postgres:postgres@localhost:5432/awa_test migrate
      - name: List jobs (empty)
        run: ./target/debug/awa --database-url postgres://postgres:postgres@localhost:5432/awa_test job list
      - name: Queue stats (empty)
        run: ./target/debug/awa --database-url postgres://postgres:postgres@localhost:5432/awa_test queue stats
      - name: Serve smoke test
        run: |
          ./target/debug/awa --database-url postgres://postgres:postgres@localhost:5432/awa_test serve &
          SERVER_PID=$!
          sleep 2
          curl -sf http://127.0.0.1:3000/api/stats
          kill $SERVER_PID
      - name: Run Rust ETL example
        run: cargo run -p awa --example etl_pipeline
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test

  # ─── Chaos smoke test ─────────────────────────────────────────
  # Lightweight version of the nightly chaos suite — catches Python
  # interop regressions (e.g., wrong client class) on every PR without
  # the full benchmark/soak overhead.
  chaos-smoke:
    name: Chaos smoke (mixed Rust + Python)
    needs: [rust-build]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Create Python venv for mixed-fleet test
        run: |
          python -m venv awa-python/.venv
          awa-python/.venv/bin/pip install --upgrade pip maturin
      - name: Build Python extension
        run: cd awa-python && .venv/bin/maturin develop
      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Run mixed Rust + Python worker smoke test
        run: |
          export AWA_PYTHON_BIN="$PWD/awa-python/.venv/bin/python"
          cargo test --package awa --test chaos_suite_test \
            test_mixed_rust_and_python_workers_share_same_queue \
            -- --exact --ignored --nocapture
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test
          PYTHONFAULTHANDLER: "1"

  # ─── Telemetry validation ─────────────────────────────────────
  telemetry-validation:
    name: Telemetry OTLP validation
    needs: [rust-build]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: awa_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      otel-lgtm:
        image: grafana/otel-lgtm:0.22.0
        ports:
          - 4317:4317
          - 4318:4318
          - 9090:9090
        options: >-
          --health-cmd "cat /tmp/ready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Wait for OTLP collector
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9090/api/v1/status/runtimeinfo && break
            echo "Waiting for Prometheus... ($i)"
            sleep 2
          done
      - name: Run telemetry integration test
        run: cargo test -p awa --test telemetry_test -- --ignored --nocapture
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/awa_test
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
          PROMETHEUS_URL: http://localhost:9090
