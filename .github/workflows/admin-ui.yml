name: Admin UI regressions

on:
  pull_request:
    paths:
      - 'awa-ui/frontend/**'
      - '.github/workflows/admin-ui.yml'
  push:
    branches: [main]
    paths:
      - 'awa-ui/frontend/**'
      - '.github/workflows/admin-ui.yml'
  workflow_dispatch:

concurrency:
  group: admin-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  operations:
    name: Synthetic operations browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: awa-ui/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: awa-ui/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:operations
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: admin-ui-regressions-${{ github.sha }}
          path: awa-ui/frontend/test-results/
          retention-days: 7
