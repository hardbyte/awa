services:
  postgres:
    # Pinned to a specific minor version. Do not track `:18-alpine` — autovacuum
    # behaviour can change across minors, and the long-horizon bench needs
    # run-over-run comparability.
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_USER: bench
    ports:
      - "${BENCH_PG_PORT:-15555}:5432"
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 256mb
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "shared_preload_libraries=${PG_SHARED_PRELOAD_LIBRARIES:-}"
      - "-c"
      - "wal_level=${BENCH_PG_WAL_LEVEL:-replica}"
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-4}"
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 180s
      start_interval: 1s
