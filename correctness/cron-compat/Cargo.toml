[package]
name = "awa-cron-compat-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# Released crates.io artifact, deliberately not a local path/git checkout.
awa = "=0.6.7"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
