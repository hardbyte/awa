\* Expected-counterexample witness for the runtime before #546: with no
\* drop, a rescued handler that never returns keeps its worker slot forever.
\* TLC reports RescuedSlotsReleased violated.
CONSTANTS
  DropRescuedHandlers = FALSE
  Jobs <- HungHandlerJobs

SPECIFICATION HungHandlerSpec

INVARIANTS
  TypeOK
  RetryHasBudget
  RescuedSlotHasStaleTask
  RunningHasPermit
  DBOwnerRequiresRunning
  CurrentOwnerConsistent
  TaskLeaseBounded
  TerminalReleasesPermit
  DeferredRowsIdle
  LocalCapacitySafe
  OverflowCapacitySafe
  BatchBounded
  RateBudgetBounded
  NoClaimAfterStopClaim
  HeartbeatUntilDrained
  ServicePhaseConsistency
  LeaderConsistent
  StoppedInstancesQuiescent

PROPERTIES
  RescuedSlotsReleased
