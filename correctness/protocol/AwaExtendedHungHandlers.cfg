\* Hung handlers (#546): a handler whose attempt was rescued may never
\* return. Dropping it past its deadline returns its worker slot, so
\* RescuedSlotsReleased holds.
CONSTANTS
  DropRescuedHandlers = TRUE
  Jobs <- HungHandlerJobs

SPECIFICATION HungHandlerSpec

INVARIANTS
  TypeOK
  RetryHasBudget
  RescuedSlotHasStaleTask
  RunningHasPermit
  DBOwnerRequiresRunning
  CurrentOwnerConsistent
  TaskLeaseBounded
  TerminalReleasesPermit
  DeferredRowsIdle
  LocalCapacitySafe
  OverflowCapacitySafe
  BatchBounded
  RateBudgetBounded
  NoClaimAfterStopClaim
  HeartbeatUntilDrained
  ServicePhaseConsistency
  LeaderConsistent
  StoppedInstancesQuiescent

PROPERTIES
  RescuedSlotsReleased
