\* Historical re-enqueue harness. Through 0.6.18 a re-enqueue reserved its
\* lane before claiming the job's unique key, while a fresh enqueue claims
\* the key first. TLC is expected to flag NoDeadlock when one of each
\* enqueues the same key into the same lane.
CONSTANTS
  TxIds = {"t1", "t2"}
  Queues = {"q1#0", "q1#1"}
  StripeA = "q1#0"
  StripeB = "q1#1"
  Priorities = {1}
  LeaseSlots = {1}
  ReadySlots = {1}
  ClaimSlots = {1}

SPECIFICATION SpecOldReEnqueueUniqueDeadlockDemo

INVARIANTS
  TypeOK
  LockCompatibility
  HeldOnlyByRunningTxs
  NoDeadlock
