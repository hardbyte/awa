\* Exhausted callback-timeout trace validation, queue without a DLQ. TLC should report
\* "Invariant CallbackTimeoutToTerminalTraceIncomplete is violated" when the trace
\* reaches Len(CallbackTimeoutToTerminalTrace) = 5.
CONSTANTS
  Jobs = {"j1"}
  Workers = {"w1"}
  ReadySegmentCount = 2
  LeaseSegmentCount = 2
  TerminalSegmentCount = 2
  ClaimSegmentCount = 2
  MaxRunLease = 2
  MaxAppendSeq = 2

SPECIFICATION SpecCallbackTimeoutToTerminal

INVARIANTS
  TypeOK
  ActiveLeasesSubsetReadyEntries
  AttemptStateRequiresLiveLease
  FreshHeartbeatRequiresLease
  ProgressRequiresAttemptState
  TerminalHasNoLiveRuntime
  TerminalHasRetainedReadyBody
  DlqHasNoLiveRuntime
  DlqAndTerminalDisjoint
  DeferredHasNoLiveRuntime
  WaitingIsLeaseState
  ReadyEntriesHaveLaneSeq
  DeferredEntriesClearLaneSeq
  ReadyLaneSeqUnique
  ClaimCursorBounded
  NoLostClaim
  ClaimOpenAndClosedDisjoint
  LaneStateConsistent
  TaskLeaseBounded
  DlqEntriesClearLaneSeq
  CallbackTimeoutToTerminalTraceIncomplete
