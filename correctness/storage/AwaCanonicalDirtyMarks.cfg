\* v046 semantics: dirty marks are append-only rows in a table with no unique
\* index, so the trigger INSERT never waits on another transaction. Expected
\* to pass: the only waits left are the application's own row locks.
CONSTANTS
  Txs <- AppTxs
  WaitFree = TRUE

SPECIFICATION Spec

INVARIANTS
  TypeOK
  NoDeadlock
  HotPathMarksNeverWait
