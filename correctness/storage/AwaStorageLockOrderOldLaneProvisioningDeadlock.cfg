\* Historical lane-provisioning harness. QueueStorage once took a new
\* lane's provisioning lock before its queue_lanes row, while SQL inserts
\* write the row first. TLC is expected to flag NoDeadlock when one of
\* each is the first to use the same lane.
CONSTANTS
  TxIds = {"t1", "t2"}
  Queues = {"q1#0", "q1#1"}
  StripeA = "q1#0"
  StripeB = "q1#1"
  Priorities = {1}
  LeaseSlots = {1}
  ReadySlots = {1}
  ClaimSlots = {1}

SPECIFICATION SpecOldLaneProvisioningDeadlockDemo

INVARIANTS
  TypeOK
  LockCompatibility
  HeldOnlyByRunningTxs
  NoDeadlock
