\* Known gap, kept as a counterexample. A completion that enqueues ADR-029
\* follow-ups makes two claim passes: the parent's release, then each
\* follow-up's claim. Two parents that each register a follow-up for the
\* other's key deadlock. TLC is expected to flag NoDeadlock.
CONSTANTS
  TxIds = {"t1", "t2"}
  Queues = {"q1#0", "q1#1"}
  StripeA = "q1#0"
  StripeB = "q1#1"
  Priorities = {1}
  LeaseSlots = {1}
  ReadySlots = {1}
  ClaimSlots = {1}

SPECIFICATION SpecCompletionFollowUpDeadlockDemo

INVARIANTS
  TypeOK
  LockCompatibility
  HeldOnlyByRunningTxs
  NoDeadlock
