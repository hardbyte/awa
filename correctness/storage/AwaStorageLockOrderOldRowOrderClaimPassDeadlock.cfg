\* Historical row-order claim-pass harness. Through 0.6.18 bulk cancel,
\* drain, batch completion, claim, rescue and discard changed unique claims
\* in row order, while a fresh enqueue claims its keys in key order. TLC is
\* expected to flag NoDeadlock.
CONSTANTS
  TxIds = {"t1", "t2"}
  Queues = {"q1#0", "q1#1"}
  StripeA = "q1#0"
  StripeB = "q1#1"
  Priorities = {1}
  LeaseSlots = {1}
  ReadySlots = {1}
  ClaimSlots = {1}

SPECIFICATION SpecOldRowOrderClaimPassDeadlockDemo

INVARIANTS
  TypeOK
  LockCompatibility
  HeldOnlyByRunningTxs
  NoDeadlock
