\* Expected-counterexample witness for the pre-#456 re-schedule behavior.
\*
\* With RescheduleStaysCanonical = TRUE a canonical-claimed attempt whose
\* handler asks to be re-scheduled (snooze / retry-after / retryable error)
\* is written back into the canonical deferred backlog
\* (`awa.scheduled_jobs`) even after routing has flipped to queue storage.
\* That move is net-zero on `canonical_live_backlog()`, so a workload that
\* snoozes on every run pins the canonical backlog above zero for as long as
\* the cluster stays in mixed transition: no drain worker ever completes the
\* job, and nothing moves it off the canonical plane. `storage_finalize` can
\* therefore never pass.
\*
\* TLC reports MixedTransitionCanReduceCanonicalBacklog violated: mixed
\* transition is in progress with a drain-capable runtime live and canonical
\* work outstanding, yet no modeled action can reduce the backlog.
\*
\* The fix (`reschedule_canonical_attempt_tx` in
\* `awa-model/src/reschedule.rs`, which records a deferred successor or, on a
\* newer-duplicate claim conflict, cancelled terminal evidence in the active
\* queue-storage schema) closes exactly this hole; the passing configuration
\* is AwaStorageTransition.cfg (RescheduleStaysCanonical = FALSE).
CONSTANTS
  MaxCanonicalBacklog = 1
  MaxQueueRows = 1
  RequireQueueExecutorOnEnter = TRUE
  GateMigrate07 = TRUE
  RescheduleStaysCanonical = TRUE

SPECIFICATION Spec

INVARIANTS
  TypeOK
  NoQueueRowsUnderCanonicalRouting
  SnoozerImpliesCanonicalWork
  MixedTransitionCanReduceCanonicalBacklog
