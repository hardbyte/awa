\* Expected counterexample for the pre-#456 behavior. A single perpetual
\* snoozer is written back into canonical scheduled_jobs after the routing
\* flip, so no modeled action can reduce the last canonical backlog row.
CONSTANTS
  MaxCanonicalBacklog = 1
  MaxQueueRows = 1
  RequireQueueExecutorOnEnter = TRUE
  RescheduleStaysCanonical = TRUE

SPECIFICATION Spec

INVARIANTS
  TypeOK
  NoQueueRowsUnderCanonicalRouting
  MixedTransitionCanReduceCanonicalBacklog
