\* Historical claim-prune harness. 0.6.16 claim prune locked the slot's
\* claim_ring_slots row before the slot's partitions, while rescue takes the
\* partitions first. TLC is expected to flag NoDeadlock.
CONSTANTS
  TxIds = {"t1", "t2"}
  Queues = {"q1#0", "q1#1"}
  StripeA = "q1#0"
  StripeB = "q1#1"
  Priorities = {1}
  LeaseSlots = {1}
  ReadySlots = {1}
  ClaimSlots = {1}

SPECIFICATION SpecOldClaimPruneSlotRowDeadlockDemo

INVARIANTS
  TypeOK
  LockCompatibility
  HeldOnlyByRunningTxs
  NoDeadlock
