<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AWA job state machine</title>
  <desc id="desc">Scheduled and retryable jobs become available when due. Workers claim available jobs as running. A running attempt can complete, snooze, retry, wait for an external callback, fail, or cancel. Callback outcomes can resume, complete, fail, or retry the job.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10341f" flood-opacity=".13"/></filter>
    <style>
      .canvas{fill:#eef8f1}.card{fill:#fff;stroke:#b9d6c4}.heading{fill:#173324}.copy{fill:#52675a}.line{fill:none;stroke:#47725a;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.callback{stroke:#47725a;stroke-dasharray:8 7}.label{fill:#376248}.deferred{fill:#fff5d9;stroke:#d7ad4f}.deferred-h{fill:#644b16}.deferred-c{fill:#735f31}.terminal{fill:#f8e6e3;stroke:#bd746a}.terminal-h{fill:#71342d}.terminal-c{fill:#81554f}.waiting{fill:#e7f0fb;stroke:#77a2cf}.waiting-h{fill:#244f76}.waiting-c{fill:#4c6b86}
      @media (prefers-color-scheme:dark){.canvas{fill:#101713}.card{fill:#17221b;stroke:#3f6b50}.heading{fill:#eff8f2}.copy{fill:#b9c9bf}.line,.callback{stroke:#72c997}.label{fill:#a9dfbd}.deferred{fill:#342d19;stroke:#d7ad4f}.deferred-h{fill:#ffe39b}.deferred-c{fill:#dbc98d}.terminal{fill:#372321;stroke:#cf8277}.terminal-h{fill:#ffc1b7}.terminal-c{fill:#dba39b}.waiting{fill:#192d40;stroke:#77a2cf}.waiting-h{fill:#b9dcff}.waiting-c{fill:#a7c6df}}
    </style>
  </defs>
  <rect class="canvas" width="1200" height="700" rx="28"/>
  <g font-family="Inter,system-ui,sans-serif">
    <text class="label" x="600" y="44" text-anchor="middle" font-size="20" font-weight="760">DURABLE JOB STATE</text>

    <!-- Edges are drawn before cards and terminate on card boundaries. -->
    <g class="line" marker-end="url(#arrow)">
      <path d="M275 160H470"/><path d="M730 160H925"/>
      <path d="M65 440C20 440 20 160 65 160"/><path d="M330 390C310 300 250 230 190 210"/>
      <path d="M560 210C500 272 330 288 170 390"/><path d="M590 210C555 282 480 320 395 390"/>
      <path d="M600 210V390"/><path d="M650 210C695 290 760 328 805 390"/><path d="M690 210C800 280 965 304 1030 390"/>
    </g>

    <!-- Resume is the only callback path drawn through the graph; the other
         callback APIs are listed below so their crossing edges do not obscure
         the handler-owned state transitions. -->
    <g class="line callback" marker-end="url(#arrow)">
      <path d="M630 390V210"/>
    </g>

    <g filter="url(#shadow)">
      <rect class="card" x="65" y="110" width="210" height="100" rx="20" stroke-width="2"/>
      <text class="heading" x="170" y="151" text-anchor="middle" font-size="22" font-weight="760">available</text>
      <text class="copy" x="170" y="180" text-anchor="middle" font-size="14">runnable now</text>

      <rect x="470" y="100" width="260" height="120" rx="22" fill="#17633e"/>
      <text x="600" y="150" text-anchor="middle" font-size="24" font-weight="760" fill="#fff">running</text>
      <text x="600" y="181" text-anchor="middle" font-size="14" fill="#d9f4e4">claimed + heartbeating</text>

      <rect x="925" y="110" width="210" height="100" rx="20" fill="#d4eee0" stroke="#6bab83" stroke-width="2"/>
      <text x="1030" y="151" text-anchor="middle" font-size="22" font-weight="760" fill="#173324">completed</text>
      <text x="1030" y="180" text-anchor="middle" font-size="14" fill="#52675a">terminal success</text>

      <rect class="deferred" x="65" y="390" width="210" height="100" rx="20" stroke-width="2"/>
      <text class="deferred-h" x="170" y="431" text-anchor="middle" font-size="22" font-weight="760">scheduled</text>
      <text class="deferred-c" x="170" y="460" text-anchor="middle" font-size="14">future run · same attempt</text>

      <rect class="deferred" x="290" y="390" width="210" height="100" rx="20" stroke-width="2"/>
      <text class="deferred-h" x="395" y="431" text-anchor="middle" font-size="22" font-weight="760">retryable</text>
      <text class="deferred-c" x="395" y="460" text-anchor="middle" font-size="14">future run · next attempt</text>

      <rect class="waiting" x="500" y="390" width="200" height="100" rx="20" stroke-width="2"/>
      <text class="waiting-h" x="600" y="429" text-anchor="middle" font-size="20" font-weight="760">waiting_external</text>
      <text class="waiting-c" x="600" y="458" text-anchor="middle" font-size="14">parked for callback</text>

      <rect class="terminal" x="710" y="390" width="190" height="100" rx="20" stroke-width="2"/>
      <text class="terminal-h" x="805" y="431" text-anchor="middle" font-size="22" font-weight="760">cancelled</text>
      <text class="terminal-c" x="805" y="460" text-anchor="middle" font-size="14">terminal</text>

      <rect class="terminal" x="935" y="390" width="190" height="100" rx="20" stroke-width="2"/>
      <text class="terminal-h" x="1030" y="431" text-anchor="middle" font-size="22" font-weight="760">failed</text>
      <text class="terminal-c" x="1030" y="460" text-anchor="middle" font-size="14">terminal · DLQ</text>
    </g>

    <g class="label" font-size="13" font-weight="700">
      <text x="350" y="147">CLAIM</text><text x="806" y="147">SUCCESS</text>
      <text x="315" y="277">SNOOZE</text><text x="462" y="304">RETRY</text>
      <text x="612" y="303">WAIT</text><text x="720" y="300">CANCEL</text><text x="878" y="294">TERMINAL / EXHAUSTED</text>
    </g>

    <g transform="translate(220 560)">
      <rect class="card" width="760" height="88" rx="18" stroke-width="2"/>
      <path class="line callback" d="M32 29h54" marker-end="url(#arrow)"/>
      <text class="heading" x="108" y="34" font-size="15" font-weight="750">External callback outcomes</text>
      <text class="copy" x="108" y="62" font-size="14">resume → running · complete → completed · retry → available · fail → failed · timeout → retryable or failed</text>
    </g>
  </g>
</svg>
