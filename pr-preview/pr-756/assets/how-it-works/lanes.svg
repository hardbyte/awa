  <g font-family="Inter,system-ui,sans-serif">
<text class="lbl" x="600" y="46" font-size="22.5" font-weight="760" text-anchor="middle">ONE QUEUE, SEVERAL LANES</text>
<text class="h" x="300" y="131" font-size="18.75" font-weight="650" text-anchor="end">email · priority 1 · shard 0</text>
<rect class="muted" x="330" y="100" width="46" height="46" rx="7"/>
