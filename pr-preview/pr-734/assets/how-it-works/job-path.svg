<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">The path of one AWA job</title>
  <desc id="desc">A producer inserts a job into a ready lane in the queue ring, or into deferred jobs when it is due later. A worker claims it, which writes a receipt in the claim ring, and a lease in the lease ring only while the handler waits for an external callback. The finished job is recorded in terminal history in the queue ring. A retry goes back to deferred jobs. One elected maintenance leader promotes due deferred jobs, rescues abandoned attempts, and rotates and prunes the three rings.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-l" x1="0" y1="0" x2="0" y2="8"/></pattern>
    <style>
.canvas{fill:#eef8f1}.card{fill:#fff;stroke:#b9d6c4;stroke-width:2}
.h{fill:#173324}.c{fill:#52675a}.lbl{fill:#376248}
.line{fill:none;stroke:#47725a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:#47725a;stroke-width:2;stroke-linecap:round}
.dash{stroke-dasharray:7 6}
.ready{fill:#dff3e6;stroke:#4f9a6c;stroke-width:2}.ready-t{fill:#1d4d31}
.claim{fill:#e7f0fb;stroke:#77a2cf;stroke-width:2}.claim-t{fill:#244f76}
.lease{fill:#fff5d9;stroke:#d7ad4f;stroke-width:2}.lease-t{fill:#644b16}
.term{fill:#f8e6e3;stroke:#bd746a;stroke-width:2}.term-t{fill:#71342d}
.muted{fill:#f1f4f2;stroke:#c6d3cb;stroke-width:2}.muted-t{fill:#6b7d72}
.bad{fill:none;stroke:#b5483b;stroke-width:3;stroke-linecap:round}.bad-t{fill:#9a3a2f}
.good-t{fill:#2f7a4b}
.hatch-l{stroke:#8fbf9f;stroke-width:2}
@media (prefers-color-scheme:dark){
.canvas{fill:#101713}.card{fill:#17221b;stroke:#3f6b50}
.h{fill:#eff8f2}.c{fill:#b9c9bf}.lbl{fill:#a9dfbd}
.line,.thin{stroke:#72c997}
.ready{fill:#173826;stroke:#4fae76}.ready-t{fill:#c8f0d6}
.claim{fill:#16283b;stroke:#5d8fc4}.claim-t{fill:#cfe3f7}
.lease{fill:#33290f;stroke:#c49a3f}.lease-t{fill:#f3e2b6}
.term{fill:#3a1d1a;stroke:#b8665d}.term-t{fill:#f4d2cd}
.muted{fill:#1c2620;stroke:#3b4a41}.muted-t{fill:#93a69a}
.bad{stroke:#e0786a}.bad-t{fill:#f0a196}.good-t{fill:#8ee0ad}
.hatch-l{stroke:#3f7a55}
}
</style>
  </defs>
  <rect class="canvas" width="1200" height="710" rx="24"/>
  <g font-family="Inter,system-ui,sans-serif">
<text class="lbl" x="600" y="46" font-size="22.5" font-weight="760" text-anchor="middle">THE PATH OF ONE JOB</text>
<rect class="card" x="40" y="110" width="200" height="150" rx="14"/>
<text class="h" x="140" y="150" font-size="25" font-weight="700" text-anchor="middle">Producer</text>
<text class="c" x="140" y="178.0" font-size="17.5" font-weight="400" text-anchor="middle">Inserts the job in</text>
<text class="c" x="140" y="203.0" font-size="17.5" font-weight="400" text-anchor="middle">the same transaction</text>
<text class="c" x="140" y="228.0" font-size="17.5" font-weight="400" text-anchor="middle">as its business write</text>
<rect class="ready" x="310" y="90" width="250" height="190" rx="14"/>
<text class="ready-t" x="435" y="124" font-size="25" font-weight="700" text-anchor="middle">Ready lanes</text>
<text class="ready-t" x="435" y="146" font-size="16.25" font-weight="600" text-anchor="middle">queue ring</text>
<rect class="muted" x="334" y="166" width="24" height="22" rx="4"/>
<rect class="muted" x="364" y="166" width="24" height="22" rx="4"/>
<rect class="card" x="394" y="166" width="24" height="22" rx="4"/>
<rect class="card" x="424" y="166" width="24" height="22" rx="4"/>
<rect class="card" x="454" y="166" width="24" height="22" rx="4"/>
<rect class="card" x="484" y="166" width="24" height="22" rx="4"/>
<rect class="card" x="514" y="166" width="24" height="22" rx="4"/>
<rect class="muted" x="334" y="196" width="24" height="22" rx="4"/>
<rect class="muted" x="364" y="196" width="24" height="22" rx="4"/>
<rect class="card" x="394" y="196" width="24" height="22" rx="4"/>
<rect class="card" x="424" y="196" width="24" height="22" rx="4"/>
<rect class="card" x="454" y="196" width="24" height="22" rx="4"/>
<rect class="card" x="484" y="196" width="24" height="22" rx="4"/>
<rect class="card" x="514" y="196" width="24" height="22" rx="4"/>
<rect class="muted" x="334" y="226" width="24" height="22" rx="4"/>
<rect class="muted" x="364" y="226" width="24" height="22" rx="4"/>
<rect class="card" x="394" y="226" width="24" height="22" rx="4"/>
<rect class="card" x="424" y="226" width="24" height="22" rx="4"/>
<rect class="card" x="454" y="226" width="24" height="22" rx="4"/>
<rect class="card" x="484" y="226" width="24" height="22" rx="4"/>
<rect class="card" x="514" y="226" width="24" height="22" rx="4"/>
<text class="c" x="435" y="270.0" font-size="16.25" font-weight="400" text-anchor="middle">FIFO within each lane</text>
<rect class="card" x="630" y="110" width="210" height="150" rx="14"/>
<text class="h" x="735" y="150" font-size="25" font-weight="700" text-anchor="middle">Worker</text>
<text class="c" x="735" y="180.0" font-size="17.5" font-weight="400" text-anchor="middle">Runs the handler and</text>
<text class="c" x="735" y="205.0" font-size="17.5" font-weight="400" text-anchor="middle">heartbeats while it</text>
<text class="c" x="735" y="230.0" font-size="17.5" font-weight="400" text-anchor="middle">holds the attempt</text>
<rect class="term" x="910" y="90" width="250" height="190" rx="14"/>
<text class="term-t" x="1035" y="124" font-size="25" font-weight="700" text-anchor="middle">Terminal history</text>
<text class="term-t" x="1035" y="146" font-size="16.25" font-weight="600" text-anchor="middle">queue ring</text>
<text class="c" x="1035" y="184.0" font-size="17.5" font-weight="400" text-anchor="middle">completed, failed</text>
<text class="c" x="1035" y="209.0" font-size="17.5" font-weight="400" text-anchor="middle">and cancelled jobs,</text>
<text class="c" x="1035" y="234.0" font-size="17.5" font-weight="400" text-anchor="middle">readable through</text>
<text class="c" x="1035" y="259.0" font-size="17.5" font-weight="400" text-anchor="middle">terminal_jobs</text>
<path class="line" d="M240 185H302" marker-end="url(#arrow)"/>
<text class="lbl" x="271" y="172" font-size="16.25" font-weight="600" text-anchor="middle">enqueue</text>
<path class="line" d="M560 185H622" marker-end="url(#arrow)"/>
<text class="lbl" x="591" y="172" font-size="16.25" font-weight="600" text-anchor="middle">claim</text>
<path class="line" d="M840 185H902" marker-end="url(#arrow)"/>
<text class="lbl" x="871" y="172" font-size="16.25" font-weight="600" text-anchor="middle">finish</text>
<rect class="claim" x="600" y="322" width="270" height="116" rx="14"/>
<text class="claim-t" x="735" y="352" font-size="22.5" font-weight="700" text-anchor="middle">Claim receipt</text>
<text class="claim-t" x="735" y="372" font-size="16.25" font-weight="600" text-anchor="middle">claim ring</text>
<text class="c" x="735" y="396.0" font-size="16.25" font-weight="400" text-anchor="middle">who owns which attempt,</text>
<text class="c" x="735" y="421.0" font-size="16.25" font-weight="400" text-anchor="middle">closed when the attempt ends</text>
<path class="thin dash" d="M735 438V476" marker-end="url(#arrow)"/>
<text class="lbl" x="745" y="462" font-size="15" font-weight="600" text-anchor="start">a callback wait adds</text>
<rect class="lease" x="600" y="484" width="270" height="84" rx="14"/>
<text class="lease-t" x="735" y="512" font-size="22.5" font-weight="700" text-anchor="middle">Lease</text>
<text class="lease-t" x="735" y="535" font-size="16.25" font-weight="600" text-anchor="middle">lease ring · only while waiting</text>
<text class="lease-t" x="735" y="556" font-size="16.25" font-weight="600" text-anchor="middle">for an external callback</text>
<path class="thin dash" d="M735 260V314" marker-end="url(#arrow)"/>
<text class="lbl" x="745" y="300" font-size="15" font-weight="600" text-anchor="start">claim writes</text>
<rect class="muted" x="310" y="330" width="250" height="126" rx="14"/>
<text class="muted-t" x="435" y="362" font-size="22.5" font-weight="700" text-anchor="middle">Deferred jobs</text>
<text class="c" x="435" y="390.0" font-size="16.25" font-weight="400" text-anchor="middle">scheduled, snoozed and</text>
<text class="c" x="435" y="415.0" font-size="16.25" font-weight="400" text-anchor="middle">retrying jobs wait here</text>
<text class="c" x="435" y="440.0" font-size="16.25" font-weight="400" text-anchor="middle">until they are due</text>
<path class="line" d="M435 330V288" marker-end="url(#arrow)"/>
<text class="lbl" x="445" y="314" font-size="15" font-weight="600" text-anchor="start">promote</text>
<path class="thin dash" d="M140 260C140 380 220 385 302 385" marker-end="url(#arrow)"/>
<text class="lbl" x="132" y="330" font-size="15" font-weight="600" text-anchor="end">run_at in</text>
<text class="lbl" x="132" y="346" font-size="15" font-weight="600" text-anchor="end">the future</text>
<path class="thin dash" d="M630 240C560 300 590 380 562 395" marker-end="url(#arrow)"/>
<text class="lbl" x="600" y="300" font-size="15" font-weight="600" text-anchor="end">retry</text>
<rect class="card" x="40" y="600" width="1120" height="76" rx="14"/>
<text class="h" x="64" y="632" font-size="22.5" font-weight="700" text-anchor="start">Maintenance leader</text>
<text class="c" x="64" y="658" font-size="16.25" font-weight="400" text-anchor="start">one worker, elected</text>
<rect class="muted" x="380" y="618" width="182" height="40" rx="20"/>
<text class="muted-t" x="471.0" y="643" font-size="17.5" font-weight="600" text-anchor="middle">promote due jobs</text>
<rect class="claim" x="580" y="618" width="267" height="40" rx="20"/>
<text class="claim-t" x="713.5" y="643" font-size="17.5" font-weight="600" text-anchor="middle">rescue abandoned attempts</text>
<rect class="ready" x="865" y="618" width="239" height="40" rx="20"/>
<text class="ready-t" x="984.5" y="643" font-size="17.5" font-weight="600" text-anchor="middle">rotate and prune rings</text>
  </g>
</svg>
