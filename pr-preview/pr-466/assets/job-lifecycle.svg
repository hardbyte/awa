<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" role="img">
  <title>AWA job lifecycle</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#47725a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10341f" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="980" height="590" rx="28" fill="#eef8f1"/>
  <g font-family="Inter,system-ui,sans-serif">
    <text x="490" y="46" text-anchor="middle" font-size="18" font-weight="750" fill="#17633e">DURABLE JOB STATE</text>

    <g fill="none" stroke="#47725a" stroke-width="3" marker-end="url(#arrow)">
      <path d="M225 150h120"/>
      <path d="M515 150h120"/>
      <path d="M515 176c38 70 107 108 188 112"/>
      <path d="M515 176c12 114 5 177-25 250"/>
      <path d="M455 176c-57 74-144 111-235 112"/>
      <path d="M640 320c-102 0-169-45-169-144" stroke-dasharray="8 7"/>
      <path d="M340 320c98 0 151-46 151-144" stroke-dasharray="8 7"/>
      <path d="M400 454H225"/>
      <path d="M580 454h175"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="55" y="112" width="170" height="76" rx="18" fill="#fff" stroke="#b9d6c4" stroke-width="2"/>
      <text x="140" y="145" text-anchor="middle" font-size="20" font-weight="750" fill="#173324">available</text>
      <text x="140" y="169" text-anchor="middle" font-size="13" fill="#52675a">runnable when due</text>

      <rect x="345" y="105" width="170" height="90" rx="18" fill="#17633e"/>
      <text x="430" y="143" text-anchor="middle" font-size="20" font-weight="750" fill="#fff">running</text>
      <text x="430" y="168" text-anchor="middle" font-size="13" fill="#d9f4e4">claimed + heartbeating</text>

      <rect x="635" y="112" width="190" height="76" rx="18" fill="#d4eee0" stroke="#6bab83" stroke-width="2"/>
      <text x="730" y="145" text-anchor="middle" font-size="20" font-weight="750" fill="#173324">completed</text>
      <text x="730" y="169" text-anchor="middle" font-size="13" fill="#52675a">terminal success</text>

      <rect x="70" y="280" width="180" height="76" rx="18" fill="#fff5d9" stroke="#d7ad4f" stroke-width="2"/>
      <text x="160" y="313" text-anchor="middle" font-size="20" font-weight="750" fill="#644b16">scheduled</text>
      <text x="160" y="337" text-anchor="middle" font-size="13" fill="#735f31">snooze, same attempt</text>

      <rect x="640" y="280" width="180" height="76" rx="18" fill="#fff5d9" stroke="#d7ad4f" stroke-width="2"/>
      <text x="730" y="313" text-anchor="middle" font-size="20" font-weight="750" fill="#644b16">retryable</text>
      <text x="730" y="337" text-anchor="middle" font-size="13" fill="#735f31">future attempt</text>

      <rect x="400" y="424" width="180" height="76" rx="18" fill="#e7f0fb" stroke="#77a2cf" stroke-width="2"/>
      <text x="490" y="457" text-anchor="middle" font-size="20" font-weight="750" fill="#244f76">waiting_external</text>
      <text x="490" y="481" text-anchor="middle" font-size="13" fill="#4c6b86">external callback</text>

      <rect x="45" y="424" width="180" height="76" rx="18" fill="#f8e6e3" stroke="#bd746a" stroke-width="2"/>
      <text x="135" y="457" text-anchor="middle" font-size="20" font-weight="750" fill="#71342d">cancelled</text>
      <text x="135" y="481" text-anchor="middle" font-size="13" fill="#81554f">terminal</text>

      <rect x="755" y="424" width="180" height="76" rx="18" fill="#f8e6e3" stroke="#bd746a" stroke-width="2"/>
      <text x="845" y="457" text-anchor="middle" font-size="20" font-weight="750" fill="#71342d">failed</text>
      <text x="845" y="481" text-anchor="middle" font-size="13" fill="#81554f">terminal / DLQ</text>
    </g>

    <g font-size="13" font-weight="650" fill="#47725a">
      <text x="270" y="137">CLAIM</text>
      <text x="557" y="137">SUCCESS</text>
      <text x="557" y="235">RETRY</text>
      <text x="280" y="238">SNOOZE</text>
      <text x="505" y="316">WAIT</text>
      <text x="520" y="540">CALLBACK RESOLVES → AVAILABLE</text>
    </g>
  </g>
</svg>
