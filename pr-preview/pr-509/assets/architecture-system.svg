<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Awa system architecture</title>
  <desc id="desc">Applications enqueue jobs transactionally into PostgreSQL. Rust and Python worker processes claim jobs, execute handlers, and finalize guarded attempts. One elected maintenance leader promotes, rescues, and reclaims storage. Operator tools observe and control the database.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#247553"/></marker>
    <style>
      .bg{fill:#f1f8f4}.box{fill:#fff;stroke:#91bea8;stroke-width:3}.db{fill:#12623f;stroke:#08462c;stroke-width:3}.head{font:700 26px system-ui,sans-serif;fill:#143b2b}.body{font:18px system-ui,sans-serif;fill:#405d50}.dbt{font:700 30px system-ui,sans-serif;fill:#fff}.dbb{font:18px system-ui,sans-serif;fill:#e2f4e9}.line{fill:none;stroke:#247553;stroke-width:5;marker-end:url(#arrow)}.dash{stroke-dasharray:12 10}.label{font:700 16px system-ui,sans-serif;fill:#195e40}.small{font:16px system-ui,sans-serif;fill:#405d50}
      @media(prefers-color-scheme:dark){.bg{fill:#111b16}.box{fill:#1b2b23;stroke:#4e8d6d}.head{fill:#eef8f2}.body,.small{fill:#c6d9ce}.label{fill:#73d3a1}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text class="head" x="600" y="48" text-anchor="middle">PostgreSQL is the coordination boundary</text>
  <rect class="box" x="55" y="95" width="320" height="145" rx="20"/>
  <text class="head" x="85" y="140">Applications</text><text class="body" x="85" y="177">Rust · Python · SQL adapters</text><text class="body" x="85" y="207">Business write + enqueue</text>
  <rect class="db" x="430" y="210" width="340" height="190" rx="28"/>
  <ellipse cx="600" cy="255" rx="125" ry="36" fill="#26875b"/>
  <text class="dbt" x="600" y="315" text-anchor="middle">PostgreSQL</text><text class="dbb" x="600" y="350" text-anchor="middle">jobs · attempts · control state</text>
  <rect class="box" x="825" y="95" width="320" height="145" rx="20"/>
  <text class="head" x="855" y="140">Worker processes</text><text class="body" x="855" y="177">Claim · execute · heartbeat</text><text class="body" x="855" y="207">Guarded complete / retry / wait</text>
  <rect class="box" x="825" y="420" width="320" height="135" rx="20"/>
  <text class="head" x="855" y="465">Maintenance leader</text><text class="body" x="855" y="502">Promote · rescue · rotate</text><text class="body" x="855" y="532">One elected worker at a time</text>
  <rect class="box" x="55" y="420" width="320" height="135" rx="20"/>
  <text class="head" x="85" y="465">Operator surfaces</text><text class="body" x="85" y="502">CLI · admin UI · metrics · traces</text><text class="body" x="85" y="532">Inspect and control</text>
  <path class="line" d="M375 170 C430 170 440 215 470 242"/><text class="label" x="395" y="152">COMMIT</text>
  <path class="line" d="M770 255 C815 240 840 205 855 180"/><text class="label" x="785" y="225">CLAIM</text>
  <path class="line dash" d="M865 225 C835 300 815 330 770 340"/><text class="label" x="815" y="315">FINALIZE</text>
  <path class="line" d="M950 420 C900 385 835 375 770 370"/><text class="label" x="850" y="398">MAINTAIN</text>
  <path class="line dash" d="M375 485 C420 450 440 410 470 390"/><text class="label" x="395" y="445">OBSERVE</text>
  <text class="small" x="600" y="590" text-anchor="middle">Every state transition is durable; attempt tokens prevent stale workers from finalizing newer attempts.</text>
</svg>
