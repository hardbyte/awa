<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">run_lease fencing of a stale worker</title>
  <desc id="desc">Worker A claims a job with run_lease 7 and heartbeats, then stalls. After 90 seconds without a heartbeat the maintenance leader rescues the attempt and closes run_lease 7. After its retry backoff, worker B claims the job with run_lease 8 and finishes it. When worker A later tries to finish run_lease 7, the write is rejected because that attempt is closed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-l" x1="0" y1="0" x2="0" y2="8"/></pattern>
    <style>
.canvas{fill:#eef8f1}.card{fill:#fff;stroke:#b9d6c4;stroke-width:2}
.h{fill:#173324}.c{fill:#52675a}.lbl{fill:#376248}
.line{fill:none;stroke:#47725a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:#47725a;stroke-width:2;stroke-linecap:round}
.dash{stroke-dasharray:7 6}
.ready{fill:#dff3e6;stroke:#4f9a6c;stroke-width:2}.ready-t{fill:#1d4d31}
.claim{fill:#e7f0fb;stroke:#77a2cf;stroke-width:2}.claim-t{fill:#244f76}
.lease{fill:#fff5d9;stroke:#d7ad4f;stroke-width:2}.lease-t{fill:#644b16}
.term{fill:#f8e6e3;stroke:#bd746a;stroke-width:2}.term-t{fill:#71342d}
.muted{fill:#f1f4f2;stroke:#c6d3cb;stroke-width:2}.muted-t{fill:#6b7d72}
.bad{fill:none;stroke:#b5483b;stroke-width:3;stroke-linecap:round}.bad-t{fill:#9a3a2f}
.good-t{fill:#2f7a4b}
.hatch-l{stroke:#8fbf9f;stroke-width:2}
@media (prefers-color-scheme:dark){
.canvas{fill:#101713}.card{fill:#17221b;stroke:#3f6b50}
.h{fill:#eff8f2}.c{fill:#b9c9bf}.lbl{fill:#a9dfbd}
.line,.thin{stroke:#72c997}
.ready{fill:#173826;stroke:#4fae76}.ready-t{fill:#c8f0d6}
.claim{fill:#16283b;stroke:#5d8fc4}.claim-t{fill:#cfe3f7}
.lease{fill:#33290f;stroke:#c49a3f}.lease-t{fill:#f3e2b6}
.term{fill:#3a1d1a;stroke:#b8665d}.term-t{fill:#f4d2cd}
.muted{fill:#1c2620;stroke:#3b4a41}.muted-t{fill:#93a69a}
.bad{stroke:#e0786a}.bad-t{fill:#f0a196}.good-t{fill:#8ee0ad}
.hatch-l{stroke:#3f7a55}
}
</style>
  </defs>
  <rect class="canvas" width="1200" height="550" rx="24"/>
  <g font-family="Inter,system-ui,sans-serif">
<text class="lbl" x="600" y="46" font-size="22.5" font-weight="760" text-anchor="middle">RUN_LEASE FENCES OUT A STALE WORKER</text>
<text class="h" x="40" y="136" font-size="21.25" font-weight="700" text-anchor="start">Worker A</text>
<path class="thin" d="M230 130H1160" stroke-opacity=".45"/>
<text class="h" x="40" y="276" font-size="21.25" font-weight="700" text-anchor="start">Leader</text>
<path class="thin" d="M230 270H1160" stroke-opacity=".45"/>
<text class="h" x="40" y="416" font-size="21.25" font-weight="700" text-anchor="start">Worker B</text>
<path class="thin" d="M230 410H1160" stroke-opacity=".45"/>
<path class="thin" d="M230 500H1160" marker-end="url(#arrow)"/>
<text class="lbl" x="1160" y="524" font-size="16.25" font-weight="600" text-anchor="end">time</text>
<rect class="claim" x="240" y="106" width="170" height="48" rx="24"/>
<text class="claim-t" x="325" y="136" font-size="17.5" font-weight="700" text-anchor="middle">claim · run_lease 7</text>
<rect class="ready" x="420" y="112" width="180" height="36" rx="18"/>
<text class="ready-t" x="510" y="136" font-size="17.5" font-weight="600" text-anchor="middle">handler runs</text>
<circle class="ready" cx="430" cy="100" r="5"/>
<circle class="ready" cx="480" cy="100" r="5"/>
<circle class="ready" cx="530" cy="100" r="5"/>
<text class="lbl" x="480" y="90" font-size="15" font-weight="600" text-anchor="middle">heartbeats</text>
<rect class="muted" x="610" y="112" width="250" height="36" rx="18"/>
<text class="muted-t" x="735" y="136" font-size="17.5" font-weight="600" text-anchor="middle">stalls: no heartbeat for 90 s</text>
<rect class="term" x="900" y="106" width="220" height="48" rx="24"/>
<text class="term-t" x="1010" y="136" font-size="17.5" font-weight="700" text-anchor="middle">finish(run_lease 7)</text>
<path class="bad" d="M1132 119 1152 139M1152 119 1132 139"/>
<text class="bad-t" x="1010" y="178" font-size="17.5" font-weight="700" text-anchor="middle">rejected: run_lease 7 is closed</text>
<rect class="claim" x="780" y="246" width="260" height="48" rx="24"/>
<text class="claim-t" x="910" y="276" font-size="17.5" font-weight="700" text-anchor="middle">rescue: close run_lease 7</text>
<path class="thin dash" d="M860 154 880 238" marker-end="url(#arrow)"/>
<text class="lbl" x="890" y="210" font-size="15" font-weight="600" text-anchor="start">stale</text>
<rect class="claim" x="850" y="386" width="180" height="48" rx="24"/>
<text class="claim-t" x="940" y="416" font-size="17.5" font-weight="700" text-anchor="middle">claim · run_lease 8</text>
<rect class="ready" x="1040" y="386" width="120" height="48" rx="24"/>
<text class="good-t" x="1100" y="416" font-size="17.5" font-weight="700" text-anchor="middle">finish(8) ✓</text>
<path class="thin dash" d="M935 294 940 378" marker-end="url(#arrow)"/>
<text class="lbl" x="948" y="344" font-size="15" font-weight="600" text-anchor="start">retried after backoff</text>
  </g>
</svg>
