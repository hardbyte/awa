# Grafana unified-alerting rules for an awa fleet that emits OTLP metrics
# to a Prometheus-compatible datasource. Import via
# `grafana-provisioning/alerting/` or the `/api/v1/provisioning/alert-rules`
# API. All rules fire on steady-state thresholds with a 5m+ "for" window so
# brief spikes don't page.
#
# Datasource UID substitution: before import, replace DS_PROMETHEUS with
# the uid of your Prometheus-compatible datasource (visible in Grafana at
# /datasources). Example:
#   sed 's/DS_PROMETHEUS/prom/' awa-alerts-prometheus.yaml > /tmp/awa.yaml
#
# Rule structure: each rule runs a Prometheus query (refId A), reduces
# every returned series to its latest value (refId B), then either
# thresholds that single value (refId C) or compares it against a second
# query with a math expression. The explicit reduce step is what lets
# Grafana's unified alerting engine handle multi-series queries — without
# it Grafana rejects the evaluation with "frame cannot uniquely be
# identified by its labels".

apiVersion: 1
groups:
  - orgId: 1
    name: awa
    folder: awa
    interval: 1m
    rules:

      - uid: awa_queue_lag_high
        title: "awa queue lag > 5 minutes"
        condition: "C"
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          owner: awa
        annotations:
          summary: "Queue {{ $labels.awa_job_queue }} has jobs waiting >5m"
          description: |
            The oldest `available` job on {{ $labels.awa_job_queue }} has been
            waiting more than 5 minutes — workers aren't keeping up with the
            producer rate. See the "Queue Lag" panel on the Awa Job Queue
            dashboard and drill into /queues/{{ $labels.awa_job_queue }} in
            awa-ui for per-job detail and pause/drain controls.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: max by (awa_job_queue) (awa_queue_lag_seconds)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [300] }

      - uid: awa_error_rate_elevated
        title: "awa error rate > 5% for 5m"
        condition: "C"
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          owner: awa
        annotations:
          summary: "Error rate above 5% over the last 5 minutes"
          description: |
            failed / (completed + failed) has been above 5% for 5 minutes.
            Something systematic is breaking — see the "Error rate" stat on
            the dashboard, then /jobs?state=failed in awa-ui for the
            specific failures.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: |
                sum(rate(awa_job_failed_total[5m]))
                  / clamp_min(
                    sum(rate(awa_job_completed_total[5m]))
                      + sum(rate(awa_job_failed_total[5m])),
                    1e-9
                  )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0.05] }

      - uid: awa_rescues_spiking
        title: "awa rescues > 1/s sustained"
        condition: "C"
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          owner: awa
        annotations:
          summary: "Jobs are being rescued faster than 1/s"
          description: |
            Maintenance is rescuing jobs at a sustained rate >1/s. Likely
            causes: worker OOMs or handler deadlocks (heartbeat rescues),
            handlers exceeding job deadline, or external callbacks timing
            out. See "Maintenance Rescues" on the dashboard.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: sum(rate(awa_maintenance_rescues_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [1] }

      - uid: awa_no_active_runtime
        title: "awa fleet has no live runtime"
        condition: "C"
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
          owner: awa
        annotations:
          summary: "No runtime has emitted awa_job_in_flight in the last 5 minutes"
          description: |
            Every worker in the fleet has either stopped exporting metrics
            or is down. See the "Active runtimes" stat on the dashboard
            and /runtime in awa-ui. Page the on-call for awa.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: count(count by (service_name, instance) (awa_job_in_flight))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: replaceNN, replaceWithValue: 0 }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: lt, params: [1] }

      - uid: awa_storage_prepared_blocked
        title: "awa storage transition prepared but blocked"
        condition: "C"
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          owner: awa
        annotations:
          summary: "Storage transition is prepared but cannot enter mixed transition"
          description: |
            The fleet is in `prepared`, but `enter_mixed_transition` has been
            blocked for 10 minutes. Common causes are live canonical-only
            runtimes still reporting, no queue-storage target runtime, or the
            prepared schema not being ready. Check /runtime in awa-ui or the
            "Storage transition" section on the dashboard.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: |
                max(awa_storage_state{awa_storage_state="prepared"})
                  * (1 - max(awa_storage_transition_ready{awa_storage_action="enter_mixed_transition"}))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: replaceNN, replaceWithValue: 0 }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0.5] }

      - uid: awa_storage_finalize_blocked
        title: "awa storage mixed transition blocked from finalize"
        condition: "C"
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          owner: awa
        annotations:
          summary: "Storage transition is in mixed_transition but cannot finalize"
          description: |
            The fleet is routing to queue storage, but finalization has been
            blocked for 10 minutes. Canonical backlog may still be draining or
            canonical/canonical_drain runtimes may still be live. Check
            /runtime in awa-ui or the "Storage transition" section on the
            dashboard.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: |
                max(awa_storage_state{awa_storage_state="mixed_transition"})
                  * (1 - max(awa_storage_transition_ready{awa_storage_action="finalize"}))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: replaceNN, replaceWithValue: 0 }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0.5] }

      - uid: awa_throughput_collapsed
        title: "awa completion throughput dropped below 10% of baseline"
        condition: "D"
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          owner: awa
        annotations:
          summary: "Completion rate has collapsed vs the 1-hour baseline"
          description: |
            Completion rate over the last 5 minutes is <10% of the 1-hour
            baseline. Unlike "error rate", this catches silent stalls
            (deadlock, worker pool exhausted, all producers offline) that
            don't surface as failures. Correlate with "Queue Lag" and
            "Active runtimes" — one of those usually explains it.
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: sum(rate(awa_job_completed_total[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: replaceNN, replaceWithValue: 0 }
          - refId: C
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: C
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: clamp_min(sum(rate(awa_job_completed_total[1h])), 0.01)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: D
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: D
              type: math
              datasource: { type: __expr__, uid: __expr__ }
              expression: $B < ($C * 0.1)

      - uid: awa_descriptor_drift_persistent
        title: "awa descriptor drift lasting > 15 minutes"
        condition: "C"
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          owner: awa
        annotations:
          summary: "Descriptor drift hasn't cleared within 15 minutes of rollout window"
          description: |
            Two or more live runtimes are reporting different BLAKE3 hashes
            for the same queue / kind descriptor. Brief drift is normal
            during a rolling deploy; persistent drift means two code
            revisions are running simultaneously. See the "Descriptor
            Health" panel on the Postgres dashboard or /runtime in awa-ui.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              # For each queue/kind, count distinct descriptor attribute
              # tuples across live info-gauge series. >1 means two runtimes
              # disagree on that target.
              expr: |
                max(
                  count by (awa_job_queue) (count by (awa_job_queue, awa_queue_display_name, awa_queue_owner, awa_queue_tags) (awa_queue_info))
                  or
                  count by (awa_job_kind) (count by (awa_job_kind, awa_job_kind_display_name, awa_job_kind_owner, awa_job_kind_tags) (awa_job_kind_info))
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [1] }

      - uid: awa_job_output_schema_missing
        title: "awa drops job outputs: schema before migration v052"
        condition: "C"
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          owner: awa
        annotations:
          summary: "Queue {{ $labels.awa_job_queue }} drops completion outputs"
          description: |
            Workers on {{ $labels.awa_job_queue }} record job outputs
            (ADR-048), but the queue-storage schema has no output columns, so
            completion outputs are dropped. A binary is running ahead of its
            migration: run `awa migrate` to apply v052. See "Job Outputs" on
            the dashboard.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: sum by (awa_job_queue) (increase(awa_job_output_dropped_total{awa_output_reason="schema_missing"}[10m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0] }

      - uid: awa_staged_follow_ups_discarded
        title: "awa handler discards staged follow-ups"
        condition: "C"
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          owner: awa
        annotations:
          summary: "Kind {{ $labels.awa_job_kind }} stages follow-ups and then parks"
          description: |
            A handler of {{ $labels.awa_job_kind }} staged follow-ups
            (ADR-046) and then returned WaitForCallback, which parks the job
            without completing it, so the follow-ups were dropped. Stage them
            after the callback resumes the handler instead. See "Staged
            Follow-ups" on the dashboard.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: sum by (awa_job_queue) (rate(awa_job_output_dropped_total{awa_output_reason="schema_missing"}[5m]))
              expr: sum by (awa_job_kind) (increase(awa_job_staged_follow_ups_discarded_total[15m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0] }

      - uid: awa_ring_rotation_stalled
        title: "awa ring has not rotated for 15 minutes"
        condition: "C"
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          owner: awa
        annotations:
          summary: "The {{ $labels.awa_ring }} ring skips every rotation as busy"
          description: |
            Maintenance has tried to rotate the {{ $labels.awa_ring }} ring for 15
            minutes and found the next slot still in use every time. Storage keeps
            growing until it rotates. On the queue ring the usual cause is a backlog
            older than one full turn of the ring; on the lease and claim rings it is a
            long-running or stuck attempt still holding the oldest slot. See "Rotation
            skip blockers" on the Awa dashboard, and /runtime in awa-ui.
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: "(sum by (awa_ring) (increase(awa_maintenance_rotate_attempts_total{awa_ring_outcome=\"skipped_busy\"}[15m])) > 0) unless on (awa_ring) (sum by (awa_ring) (increase(awa_maintenance_rotate_attempts_total{awa_ring_outcome=\"rotated\"}[15m])) > 0)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0] }

      - uid: awa_ring_prune_blocked
        title: "awa ring prune blocked for 30 minutes"
        condition: "C"
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          owner: awa
        annotations:
          summary: "Pruning the {{ $labels.awa_ring }} ring has been blocked for 30 minutes"
          description: |
            Every prune of the {{ $labels.awa_ring }} ring in the last 30 minutes
            timed out waiting for a lock, and none succeeded. A session holding a lock
            or a long transaction on the oldest partition is the usual cause; completed
            rows are not reclaimed until it ends. Find it with the "Inspect long
            transactions" query in the troubleshooting guide. See "Prune rate by ring +
            outcome" on the Awa dashboard.
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: "(sum by (awa_ring) (increase(awa_maintenance_prune_attempts_total{awa_ring_outcome=\"blocked\"}[30m])) > 0) unless on (awa_ring) (sum by (awa_ring) (increase(awa_maintenance_prune_attempts_total{awa_ring_outcome=\"pruned\"}[30m])) > 0)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0] }

      - uid: awa_maintenance_branch_overrunning
        title: "awa maintenance branch overrunning its interval"
        condition: "C"
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          owner: awa
        annotations:
          summary: "Maintenance branch {{ $labels.awa_maintenance_branch }} keeps overrunning its interval"
          description: |
            The {{ $labels.awa_maintenance_branch }} maintenance branch has taken
            longer than its interval in every 10-minute window for 15 minutes, so its
            work (rescue, promotion, rotation or pruning) runs late. Check database
            load and the branch's duration histogram on the Awa dashboard.
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: "sum by (awa_maintenance_branch) (increase(awa_maintenance_branch_overrun_total[10m]))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0] }

      - uid: awa_dlq_growing
        title: "awa DLQ growing for an hour"
        condition: "C"
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          owner: awa
        annotations:
          summary: "The dead-letter queue for {{ $labels.awa_job_queue }} keeps growing"
          description: |
            {{ $labels.awa_job_queue }} has added dead-lettered jobs in every
            1-hour window for 30 minutes. Each one is a job that exhausted its
            attempts or failed permanently. Look at /dlq in awa-ui for the failing
            kinds and errors, then retry or purge.
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: DS_PROMETHEUS
            model:
              refId: A
              datasource: { type: prometheus, uid: DS_PROMETHEUS }
              expr: "max by (awa_job_queue) (delta(awa_job_dlq_depth[1h]))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              conditions:
                - type: query
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  evaluator: { type: gt, params: [0] }
