<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Where AWA batches work</title>
  <desc id="desc">Enqueue inserts many jobs in one statement and reserves each lane once. A claim takes up to 512 jobs, one per free worker permit, and writes one shared receipt row. Finished jobs are grouped per completion shard and written by one statement once 512 are waiting or none has arrived for a millisecond.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-l" x1="0" y1="0" x2="0" y2="8"/></pattern>
    <style>
.canvas{fill:#eef8f1}.card{fill:#fff;stroke:#b9d6c4;stroke-width:2}
.h{fill:#173324}.c{fill:#52675a}.lbl{fill:#376248}
.line{fill:none;stroke:#47725a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.thin{fill:none;stroke:#47725a;stroke-width:2;stroke-linecap:round}
.dash{stroke-dasharray:7 6}
.ready{fill:#dff3e6;stroke:#4f9a6c;stroke-width:2}.ready-t{fill:#1d4d31}
.claim{fill:#e7f0fb;stroke:#77a2cf;stroke-width:2}.claim-t{fill:#244f76}
.lease{fill:#fff5d9;stroke:#d7ad4f;stroke-width:2}.lease-t{fill:#644b16}
.term{fill:#f8e6e3;stroke:#bd746a;stroke-width:2}.term-t{fill:#71342d}
.muted{fill:#f1f4f2;stroke:#c6d3cb;stroke-width:2}.muted-t{fill:#6b7d72}
.bad{fill:none;stroke:#b5483b;stroke-width:3;stroke-linecap:round}.bad-t{fill:#9a3a2f}
.good-t{fill:#2f7a4b}
.hatch-l{stroke:#8fbf9f;stroke-width:2}
@media (prefers-color-scheme:dark){
.canvas{fill:#101713}.card{fill:#17221b;stroke:#3f6b50}
.h{fill:#eff8f2}.c{fill:#b9c9bf}.lbl{fill:#a9dfbd}
.line,.thin{stroke:#72c997}
.ready{fill:#173826;stroke:#4fae76}.ready-t{fill:#c8f0d6}
.claim{fill:#16283b;stroke:#5d8fc4}.claim-t{fill:#cfe3f7}
.lease{fill:#33290f;stroke:#c49a3f}.lease-t{fill:#f3e2b6}
.term{fill:#3a1d1a;stroke:#b8665d}.term-t{fill:#f4d2cd}
.muted{fill:#1c2620;stroke:#3b4a41}.muted-t{fill:#93a69a}
.bad{stroke:#e0786a}.bad-t{fill:#f0a196}.good-t{fill:#8ee0ad}
.hatch-l{stroke:#3f7a55}
}
</style>
  </defs>
  <rect class="canvas" width="1200" height="420" rx="24"/>
  <g font-family="Inter,system-ui,sans-serif">
<text class="lbl" x="600" y="46" font-size="22.5" font-weight="760" text-anchor="middle">THREE PLACES AWA BATCHES</text>
<rect class="card" x="40" y="80" width="360" height="300" rx="14"/>
<text class="ready-t" x="220" y="118" font-size="25" font-weight="760" text-anchor="middle">1 · Enqueue</text>
<text class="c" x="220" y="150.0" font-size="17.5" font-weight="400" text-anchor="middle">one statement inserts</text>
<text class="c" x="220" y="175.0" font-size="17.5" font-weight="400" text-anchor="middle">many jobs; each lane</text>
<text class="c" x="220" y="200.0" font-size="17.5" font-weight="400" text-anchor="middle">is reserved once</text>
<rect class="card" x="420" y="80" width="360" height="300" rx="14"/>
<text class="claim-t" x="600" y="118" font-size="25" font-weight="760" text-anchor="middle">2 · Claim</text>
<text class="c" x="600" y="150.0" font-size="17.5" font-weight="400" text-anchor="middle">one claim takes up to</text>
<text class="c" x="600" y="175.0" font-size="17.5" font-weight="400" text-anchor="middle">512 jobs, one per free</text>
<text class="c" x="600" y="200.0" font-size="17.5" font-weight="400" text-anchor="middle">worker permit</text>
<rect class="card" x="800" y="80" width="360" height="300" rx="14"/>
<text class="term-t" x="980" y="118" font-size="25" font-weight="760" text-anchor="middle">3 · Complete</text>
<text class="c" x="980" y="150.0" font-size="17.5" font-weight="400" text-anchor="middle">finished jobs queue per</text>
<text class="c" x="980" y="175.0" font-size="17.5" font-weight="400" text-anchor="middle">shard until 512 wait or</text>
<text class="c" x="980" y="200.0" font-size="17.5" font-weight="400" text-anchor="middle">none arrive for 1 ms</text>
<rect class="muted" x="70" y="240" width="30" height="30" rx="6"/>
<rect class="muted" x="110" y="240" width="30" height="30" rx="6"/>
<rect class="muted" x="150" y="240" width="30" height="30" rx="6"/>
<rect class="muted" x="190" y="240" width="30" height="30" rx="6"/>
<rect class="muted" x="230" y="240" width="30" height="30" rx="6"/>
<rect class="muted" x="270" y="240" width="30" height="30" rx="6"/>
<path class="line" d="M190 278V306" marker-end="url(#arrow)"/>
<rect class="ready" x="80" y="314" width="220" height="40" rx="20"/>
<text class="ready-t" x="190" y="339" font-size="17.5" font-weight="700" text-anchor="middle">1 insert statement</text>
<circle class="claim" cx="465" cy="255" r="13"/>
<circle class="claim" cx="505" cy="255" r="13"/>
<circle class="claim" cx="545" cy="255" r="13"/>
<circle class="claim" cx="585" cy="255" r="13"/>
<circle class="claim" cx="625" cy="255" r="13"/>
<circle class="claim" cx="665" cy="255" r="13"/>
<text class="lbl" x="600" y="230" font-size="15" font-weight="600" text-anchor="middle">free permits</text>
<path class="line" d="M600 278V306" marker-end="url(#arrow)"/>
<rect class="claim" x="490" y="314" width="220" height="40" rx="20"/>
<text class="claim-t" x="600" y="339" font-size="17.5" font-weight="700" text-anchor="middle">1 shared receipt row</text>
<rect class="muted" x="830" y="226" width="90" height="26" rx="13"/>
<text class="muted-t" x="875" y="244" font-size="15" font-weight="700" text-anchor="middle">shard 0</text>
<rect class="term" x="930" y="229" width="20" height="20" rx="4"/>
<rect class="term" x="956" y="229" width="20" height="20" rx="4"/>
<rect class="term" x="982" y="229" width="20" height="20" rx="4"/>
<rect class="term" x="1008" y="229" width="20" height="20" rx="4"/>
<rect class="muted" x="830" y="258" width="90" height="26" rx="13"/>
<text class="muted-t" x="875" y="276" font-size="15" font-weight="700" text-anchor="middle">shard 1</text>
<rect class="term" x="930" y="261" width="20" height="20" rx="4"/>
<rect class="term" x="956" y="261" width="20" height="20" rx="4"/>
<rect class="term" x="982" y="261" width="20" height="20" rx="4"/>
<rect class="term" x="1008" y="261" width="20" height="20" rx="4"/>
<path class="line" d="M980 288V306" marker-end="url(#arrow)"/>
<rect class="term" x="870" y="314" width="220" height="40" rx="20"/>
<text class="term-t" x="980" y="339" font-size="17.5" font-weight="700" text-anchor="middle">1 write per shard batch</text>
<path class="thin" d="M400 230H412" marker-end="url(#arrow)"/>
<path class="thin" d="M780 230H792" marker-end="url(#arrow)"/>
  </g>
</svg>
