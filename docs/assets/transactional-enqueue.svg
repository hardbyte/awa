<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img">
  <title>Transactional enqueue commits application data and an AWA job atomically</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#287a51"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#10341f" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="960" height="500" rx="28" fill="#eef8f1"/>
  <g font-family="Inter,system-ui,sans-serif">
    <text x="480" y="43" text-anchor="middle" font-size="18" font-weight="750" fill="#17633e">ATOMIC HANDOFF</text>

    <g filter="url(#shadow)">
      <rect x="46" y="105" width="220" height="118" rx="18" fill="#fff" stroke="#b9d6c4" stroke-width="2"/>
      <text x="156" y="146" text-anchor="middle" font-size="22" font-weight="750" fill="#173324">Application</text>
      <text x="156" y="176" text-anchor="middle" font-size="14" fill="#52675a">request · service · command</text>
      <text x="156" y="200" text-anchor="middle" font-size="14" fill="#52675a">owns the transaction</text>

      <rect x="318" y="78" width="370" height="296" rx="24" fill="#fff" stroke="#6bab83" stroke-width="3"/>
      <rect x="346" y="108" width="314" height="56" rx="12" fill="#17633e"/>
      <text x="503" y="143" text-anchor="middle" font-size="19" font-weight="750" fill="#fff">BEGIN PostgreSQL transaction</text>

      <rect x="366" y="195" width="274" height="58" rx="14" fill="#e7f0fb" stroke="#77a2cf" stroke-width="2"/>
      <text x="503" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#244f76">INSERT application row</text>
      <text x="503" y="242" text-anchor="middle" font-size="13" fill="#4c6b86">for example, an order</text>

      <rect x="366" y="276" width="274" height="58" rx="14" fill="#d4eee0" stroke="#6bab83" stroke-width="2"/>
      <text x="503" y="302" text-anchor="middle" font-size="17" font-weight="700" fill="#173324">INSERT AWA job</text>
      <text x="503" y="323" text-anchor="middle" font-size="13" fill="#52675a">using the same connection</text>

      <rect x="746" y="105" width="168" height="118" rx="18" fill="#17633e"/>
      <text x="830" y="146" text-anchor="middle" font-size="22" font-weight="750" fill="#fff">COMMIT</text>
      <text x="830" y="177" text-anchor="middle" font-size="14" fill="#d9f4e4">both rows</text>
      <text x="830" y="198" text-anchor="middle" font-size="14" fill="#d9f4e4">or neither</text>
    </g>

    <path d="M266 164h52" fill="none" stroke="#287a51" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M688 164h58" fill="none" stroke="#287a51" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M830 223v112c0 50-48 75-111 75" fill="none" stroke="#287a51" stroke-width="4" marker-end="url(#arrow)"/>

    <g>
      <rect x="337" y="399" width="382" height="64" rx="18" fill="#d8ebe0"/>
      <text x="528" y="427" text-anchor="middle" font-size="18" font-weight="750" fill="#173324">Worker can now claim the job</text>
      <text x="528" y="449" text-anchor="middle" font-size="13" fill="#52675a">and is guaranteed to see the committed application data</text>
    </g>
  </g>
</svg>
