<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Transactional enqueue</title>
  <desc id="desc">Inside one PostgreSQL transaction, the application inserts business data and an AWA job, then commits both. Only after commit can a worker claim the job.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#10341f" flood-opacity=".14"/></filter>
    <style>
      .canvas{fill:#eef8f1}.surface{fill:#fff;stroke:#b9d6c4}.heading{fill:#173324}.copy{fill:#52675a}.boundary{fill:#fff;stroke:#6bab83}.line{fill:none;stroke:#287a51;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.label{fill:#17633e}.output{fill:#d8ebe0}
      @media (prefers-color-scheme:dark){.canvas{fill:#101713}.surface,.boundary{fill:#17221b;stroke:#3f6b50}.heading{fill:#eff8f2}.copy{fill:#b9c9bf}.line{stroke:#55c58a}.label{fill:#8de2b1}.output{fill:#20392b}}
    </style>
  </defs>
  <rect class="canvas" width="960" height="520" rx="28"/>
  <g font-family="Inter,system-ui,sans-serif">
    <text class="label" x="480" y="42" text-anchor="middle" font-size="19" font-weight="750">ATOMIC HANDOFF</text>

    <g filter="url(#shadow)">
      <rect class="surface" x="40" y="176" width="210" height="120" rx="20" stroke-width="2"/>
      <text class="heading" x="145" y="218" text-anchor="middle" font-size="22" font-weight="750">Application</text>
      <text class="copy" x="145" y="249" text-anchor="middle" font-size="14">request · service · command</text>
      <text class="copy" x="145" y="273" text-anchor="middle" font-size="14">owns the transaction</text>

      <rect class="boundary" x="305" y="74" width="370" height="330" rx="25" stroke-width="3"/>
      <text class="label" x="490" y="106" text-anchor="middle" font-size="14" font-weight="750">ONE POSTGRESQL TRANSACTION</text>

      <rect x="347" y="128" width="286" height="54" rx="13" fill="#17633e"/>
      <text x="490" y="162" text-anchor="middle" font-size="19" font-weight="760" fill="#fff">BEGIN</text>

      <rect x="347" y="204" width="286" height="58" rx="13" fill="#e7f0fb" stroke="#77a2cf" stroke-width="2"/>
      <text x="490" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#244f76">INSERT application row</text>
      <text x="490" y="251" text-anchor="middle" font-size="13" fill="#4c6b86">for example, an order</text>

      <rect x="347" y="282" width="286" height="58" rx="13" fill="#d4eee0" stroke="#6bab83" stroke-width="2"/>
      <text x="490" y="308" text-anchor="middle" font-size="17" font-weight="700" fill="#173324">INSERT AWA job</text>
      <text x="490" y="329" text-anchor="middle" font-size="13" fill="#52675a">using the same connection</text>

      <rect x="347" y="360" width="286" height="54" rx="13" fill="#17633e"/>
      <text x="490" y="394" text-anchor="middle" font-size="19" font-weight="760" fill="#fff">COMMIT</text>

      <rect class="surface" x="730" y="176" width="190" height="120" rx="20" stroke-width="2"/>
      <text class="heading" x="825" y="218" text-anchor="middle" font-size="22" font-weight="750">Worker</text>
      <text class="copy" x="825" y="249" text-anchor="middle" font-size="14">claims only after</text>
      <text class="copy" x="825" y="273" text-anchor="middle" font-size="14">the commit is visible</text>
    </g>

    <path class="line" d="M250 236H305" marker-end="url(#arrow)"/>
    <path class="line" d="M633 387H692c18 0 28-12 28-28V252c0-10 4-16 10-16" marker-end="url(#arrow)"/>
    <path class="line" d="M490 182v22M490 262v20M490 340v20" marker-end="url(#arrow)"/>

    <g>
      <rect class="output" x="276" y="451" width="408" height="44" rx="22"/>
      <text class="heading" x="480" y="478" text-anchor="middle" font-size="14" font-weight="700">BOTH ROWS COMMIT — OR NEITHER DOES</text>
    </g>
  </g>
</svg>
