# Used by the CI migration shards (scripts/ci-test-shard.sh); harmless for
# local `cargo nextest run`.
#
# The slow-timeout only FLAGS tests, it never kills them — it is the durable
# per-run list of >60s tests that #335's real-time-window audit works from.
[profile.default]
slow-timeout = { period = "60s" }

[test-groups]
bulk-rescue-backlog = { max-threads = 1 }
cron-evaluator = { max-threads = 1 }

# The two bulk rescue backlog tests each load the same database heavily; run
# concurrently, the live runtime in one cannot heartbeat its claims inside the
# staleness window.
[[profile.default.overrides]]
filter = 'binary(bulk_rescue_test) and test(/^rescue_drains_/)'
test-group = 'bulk-rescue-backlog'

# cron_test's end-to-end test runs a leader whose cron evaluator fires every
# due schedule in the table, including other tests'. Under `cargo test` the
# CRON_EVALUATOR lock in the file keeps them apart; nextest runs each test in
# its own process, so the binary runs one test at a time here instead.
[[profile.default.overrides]]
filter = 'binary(cron_test)'
test-group = 'cron-evaluator'
